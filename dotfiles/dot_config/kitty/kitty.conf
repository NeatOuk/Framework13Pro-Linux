font_family      JetBrains Mono
font_size        11.5
window_padding_width 14
confirm_os_window_close 0
enable_audio_bell no
hide_window_decorations yes

# Tiles inside kitty, no tabs: Ctrl+Shift+T splits the current pane (same folder); Ctrl+Shift+Enter works too.
# Layout "splits" tiles the panes; "stack" (Ctrl+Shift+L cycles) shows one pane full size.
enabled_layouts splits,stack
map ctrl+shift+t launch --location=split --cwd=current
map ctrl+shift+enter launch --location=split --cwd=current

# Colours: written by fw13.theme
include ~/.config/fw13/theme/kitty.conf

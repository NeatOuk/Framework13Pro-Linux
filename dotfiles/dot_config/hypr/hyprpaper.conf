# Rendered by fw13.wallpaper from the picture chosen with fw-wallpaper (SUPER+W) or Settings → Appearance
# hyprpaper ≥ 0.8 syntax (no `preload`); an empty monitor = is the fallback for every output; a missing file → plain colour
wallpaper {
  monitor =
  path = ~/.config/fw13/theme/desktop.jpg
  fit_mode = cover
}
splash = false

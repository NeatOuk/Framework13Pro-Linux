# Lock screen styled like the tuigreet login (plain text box, no wallpaper; user decision). Colours ($fw_*): written by fw13.theme
source = ~/.config/fw13/theme/hyprlock.conf
general {
  hide_cursor = true
  ignore_empty_input = true
}
auth {
  fingerprint {
    enabled = true                 # fprintd; enroll with fprintd-enroll
  }
}
background {
  monitor =
  color = $fw_base
}
# tuigreet --time: date line at the top
label {
  monitor =
  text = cmd[update:1000] date '+%a, %d %b %Y - %H:%M:%S'
  color = $fw_text
  font_size = 14
  font_family = $fw_font
  position = 0, -20
  halign = center
  valign = top
}
# the bordered prompt box
shape {
  monitor =
  size = 520, 190
  color = $fw_base
  border_size = 2
  border_color = $fw_clock
  rounding = 0
  position = 0, 0
  halign = center
  valign = center
}
label {
  monitor =
  text = cmd[update:0] echo "Authenticate into $(hostname)"
  color = $fw_text
  font_size = 14
  font_family = $fw_font
  position = 0, 55
  halign = center
  valign = center
}
label {
  monitor =
  text = Username: $USER
  color = $fw_text
  font_size = 14
  font_family = $fw_font
  position = -60, 10
  halign = center
  valign = center
}
input-field {
  monitor =
  size = 420, 40
  position = 0, -45
  halign = center
  valign = center
  outline_thickness = 1
  inner_color = $fw_base
  outer_color = $fw_clock
  font_color = $fw_text
  check_color = $fw_check
  fail_color = $fw_fail
  font_family = $fw_font
  placeholder_text = Password:
  fail_text = Authentication failed
  dots_center = false
  dots_size = 0.25
  rounding = 0
  shadow_passes = 0
  fade_on_empty = false
}
# tuigreet's bottom hint line
label {
  monitor =
  text = Scan fingerprint or type password
  color = $fw_clock
  font_size = 12
  font_family = $fw_font
  position = 20, 15
  halign = left
  valign = bottom
}

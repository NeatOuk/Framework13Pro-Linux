# Lock screen (centered, minimal). Colours ($fw_*): written by fw13.theme
source = ~/.config/fw13/theme/hyprlock.conf
general {
  hide_cursor = true
  ignore_empty_input = true
}
auth {
  fingerprint {
    enabled = true                 # fprintd; enroll with fprintd-enroll
    ready_message = Scan fingerprint or type password
  }
}
background {
  monitor =
  color = $fw_base
  path = ~/.config/fw13/theme/lock.jpg  # fw13.wallpaper (lock effect); missing → colour only
  blur_passes = 0  # blur comes from the lock-screen effect (Settings → Appearance), not hyprlock
}
input-field {
  monitor =
  size = 600, 80
  position = 0, 0
  halign = center
  valign = center
  outline_thickness = 3
  inner_color = $fw_inner
  outer_color = $fw_outer
  font_color = $fw_text
  check_color = $fw_check
  fail_color = $fw_fail
  font_family = JetBrains Mono
  placeholder_text = Enter password
  rounding = 0
  shadow_passes = 0
  fade_on_empty = false
}
label {
  monitor =
  text = $TIME
  color = $fw_clock
  font_size = 72
  font_family = JetBrains Mono
  position = 0, 160
  halign = center
  valign = center
}

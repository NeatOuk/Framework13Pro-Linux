# Tokyo Night lock screen (centered, minimal)
general {
  hide_cursor = true
  ignore_empty_input = true
}
auth {
  fingerprint {
    enabled = true                 # fprintd; enroll with fprintd-enroll
    ready_message = Scan fingerprint or type password
  }
}
background {
  monitor =
  color = rgba(1a1b26ff)
  path = ~/.config/hypr/wallpaper.jpg
  blur_passes = 3
}
input-field {
  monitor =
  size = 600, 80
  position = 0, 0
  halign = center
  valign = center
  outline_thickness = 3
  inner_color = rgba(1a1b26cc)
  outer_color = rgba(7aa2f7ff)
  font_color = rgba(c0caf5ff)
  check_color = rgba(9ece6aff)
  fail_color = rgba(f7768eff)
  font_family = JetBrains Mono
  placeholder_text = Enter password
  rounding = 0
  shadow_passes = 0
  fade_on_empty = false
}
label {
  monitor =
  text = $TIME
  color = rgba(a9b1d6ff)
  font_size = 72
  font_family = JetBrains Mono
  position = 0, 160
  halign = center
  valign = center
}

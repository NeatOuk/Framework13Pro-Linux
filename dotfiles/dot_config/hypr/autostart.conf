exec-once = uwsm app -- waybar
exec-once = uwsm app -- mako
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- hypridle
exec-once = systemctl --user start hyprpolkitagent
# blueman-applet stays for its pairing agent; its tray icon is off (the bar's bluetooth module replaces it).
exec-once = gsettings set org.blueman.general plugin-list "['!StatusIcon']" && uwsm app -- blueman-applet
exec-once = uwsm app -- fcitx5 -d --replace
exec-once = uwsm app -- wl-paste --watch cliphist store
# Per-screen workspace ranges + login layout (kitty on the laptop's 1, Chromium on the monitor's 1)
exec-once = uwsm app -- fw-workspaces daemon

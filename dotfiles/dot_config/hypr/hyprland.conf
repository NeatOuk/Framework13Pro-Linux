# Hyprland — Framework 13 (AMD Ryzen AI 9 HX 370 · Radeon 890M)
# Clean, minimal look (Tokyo Night, flat borders); simple conventional keys.
# Targets Hyprland >= 0.53 (match:/effect windowrule syntax). Check: hyprctl version

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/windows.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/local.conf        # machine-local, created once, never overwritten

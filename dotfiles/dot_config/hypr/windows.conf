# 0.53+ syntax: windowrule = match:<prop> <regex>, <effect> <value>
windowrule = match:class ^(steam_app_.*)$, immediate on
windowrule = match:class ^(gamescope)$, immediate on
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(org.fcitx.fcitx5-config-qt)$, float on
windowrule = match:class ^(fw-btop)$, float on
windowrule = match:class ^(fw-btop)$, size 1200 760
windowrule = match:class ^(thunar)$, match:title ^(File Operation Progress)$, float on
windowrule = match:class ^(steam)$, match:title ^(Friends List|Steam Settings)$, float on

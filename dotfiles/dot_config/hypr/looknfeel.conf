general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = $accent $magenta 45deg
  col.inactive_border = $muted
  layout = dwindle
  resize_on_border = false
  allow_tearing = true                 # games opt in via `immediate` rules
}

decoration {
  rounding = 0
  shadow {
    enabled = true
    range = 2
    render_power = 3
    color = rgba(1a1a1aee)
  }
  blur {
    enabled = true
    size = 3
    passes = 1
  }
}

animations {
  enabled = true
  bezier = easeOutQuint, 0.23, 1, 0.32, 1
  animation = windows, 1, 4.8, easeOutQuint
  animation = fade, 1, 3, easeOutQuint
  animation = workspaces, 1, 2, easeOutQuint, slide
}

dwindle {
  preserve_split = true
  force_split = 2
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  focus_on_activate = true
  vrr = 2
}

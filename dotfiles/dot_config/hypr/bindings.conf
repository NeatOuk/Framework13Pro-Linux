# Simple, conventional keymap.
$term    = uwsm app -- kitty
$browser = uwsm app -- chromium-browser
$files   = uwsm app -- thunar
$editor  = uwsm app -- code
$menu    = fuzzel --launch-prefix="uwsm app -- "

# Apps
bind = SUPER, RETURN,   exec, $term
bind = SUPER, SPACE,    exec, $menu
bind = SUPER, B,        exec, $browser
bind = SUPER, E,        exec, $files
bind = SUPER, C,        exec, $editor
bind = SUPER SHIFT, A,  exec, uwsm app -- kitty -e claude
bind = SUPER SHIFT, T,  exec, uwsm app -- kitty --class fw-btop -e btop

# Windows
bind = SUPER, Q,        killactive
bind = SUPER, F,        fullscreen, 0
bind = SUPER, T,        togglefloating
bind = SUPER, J,        layoutmsg, togglesplit
bind = SUPER, P,        pseudo
bind = SUPER, S,        togglespecialworkspace, scratchpad
bind = SUPER SHIFT, S,  movetoworkspacesilent, special:scratchpad

# Session
bind = SUPER, L,        exec, loginctl lock-session
bind = SUPER, ESCAPE,   exec, fw-system-menu

# Focus / move
bind = SUPER, left,  movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up,    movefocus, u
bind = SUPER, down,  movefocus, d
bind = SUPER SHIFT, left,  movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up,    movewindow, u
bind = SUPER SHIFT, down,  movewindow, d
binde = SUPER CTRL, left,  resizeactive, -50 0
binde = SUPER CTRL, right, resizeactive, 50 0
binde = SUPER CTRL, up,    resizeactive, 0 -50
binde = SUPER CTRL, down,  resizeactive, 0 50
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER, TAB,        workspace, previous
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up,   workspace, e-1

# Clipboard / capture / tools
bind = SUPER, V,       exec, cliphist list | fuzzel --dmenu --prompt 'Clipboard › ' | cliphist decode | wl-copy
bind = , PRINT,        exec, fw-capture region
bind = SHIFT, PRINT,   exec, fw-capture screen
bind = ALT, PRINT,     exec, fw-record
bind = SUPER, PRINT,   exec, hyprpicker -a
bind = SUPER, N,       exec, fw-nightlight
bind = SUPER, comma,   exec, makoctl dismiss
bind = SUPER SHIFT, comma, exec, makoctl dismiss --all
bind = SUPER SHIFT, B, exec, uwsm app -- timeshift-launcher

# Laptop keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# Read by systemd --user, so uwsm-launched apps (fuzzel, VS Code, Chromium) see these.
# ~/.local/bin first: native installers (Claude Code) must win over same-named mise shims.
PATH=${HOME}/.local/bin:${HOME}/.local/share/mise/shims:${PATH}
# OpenCode merges the Ollama servers managed by fw-opencode (bar OpenCode icon) into its own config.
OPENCODE_CONFIG=${HOME}/.config/fw-opencode/opencode.json
# fcitx5 on Wayland: GTK/Electron use text-input-v3 natively; don't set GTK_IM_MODULE.
XMODIFIERS=@im=fcitx
QT_IM_MODULES=wayland;fcitx
# Electron/Chromium native Wayland
ELECTRON_OZONE_PLATFORM_HINT=auto

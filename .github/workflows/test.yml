# Run the real installer inside clean Fedora containers.
# Catches: missing/renamed packages, repo setup failures, script errors, dotfile template errors.
# Can't test (needs hardware/GUI): Hyprland session, Wi-Fi, fingerprint, suspend — see README "Testing".
name: test-install
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 20 * * 1"   # weekly, Mon 03:17 Phnom Penh — catches upstream package renames
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh system/usr/local/bin/* dotfiles/dot_local/bin/executable_*
      - name: config syntax
        run: |
          python3 - <<'PY'
          import json, re, tomllib
          s = open('dotfiles/dot_config/waybar/config.jsonc').read()
          json.loads(re.sub(r'^\s*//.*$', '', s, flags=re.M))
          for f in ['dotfiles/dot_config/mise/config.toml', 'dotfiles/dot_config/starship.toml']:
              tomllib.load(open(f, 'rb'))
          print('ok')
          PY

  install:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fedora: ["44"]
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - run: dnf -y install git
      - uses: actions/checkout@v4
      - name: Run installer (CI mode)
        run: ./install.sh --ci 2>&1 | tee install.log
      - name: Verify key binaries and dotfiles
        run: |
          for b in Hyprland hyprlock hypridle waybar fuzzel kitty uwsm chromium-browser code steam timeshift restic mise; do
            if command -v "$b" >/dev/null; then echo "ok  $b"; else echo "MISSING $b"; exit 1; fi
          done
          test -f "$HOME/.config/hypr/hyprland.conf"
          for t in claude chezmoi starship node; do mise which "$t"; done
      # ponytail: experimental — no GPU and no systemd in the container, so Hyprland runs headless
      # on llvmpipe and autostart's `uwsm app` entries are started by hand. Never fails the job.
      - name: Screenshot (headless Hyprland)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg HYPRLAND_HEADLESS_ONLY=1 LIBGL_ALWAYS_SOFTWARE=1
          install -d -m 0700 "$XDG_RUNTIME_DIR"
          # CI container runs as root; Hyprland refuses that without this flag
          Hyprland --i-am-really-stupid > hyprland.log 2>&1 &
          for _ in $(seq 30); do
            sigs=("$XDG_RUNTIME_DIR"/hypr/*/.socket.sock)
            [[ -e ${sigs[0]} ]] && break; sleep 1
          done
          [[ -e ${sigs[0]} ]] || { cat hyprland.log; echo "Hyprland did not start"; exit 1; }
          HYPRLAND_INSTANCE_SIGNATURE="$(basename "$(dirname "${sigs[0]}")")"
          export HYPRLAND_INSTANCE_SIGNATURE
          hyprctl output create headless
          for app in hyprpaper waybar mako kitty; do hyprctl dispatch exec "$app"; done
          sleep 10
          socks=("$XDG_RUNTIME_DIR"/wayland-[0-9])  # skip the .lock file
          WAYLAND_DISPLAY="$(basename "${socks[0]}")" grim desktop.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-f${{ matrix.fedora }}
          path: |
            desktop.png
            hyprland.log
          if-no-files-found: ignore
      - name: Report
        if: always()
        run: |
          {
            echo "## Fedora ${{ matrix.fedora }} — install report"
            echo '```'
            cat "$HOME/.local/state/fw13-hypr/install-report.txt" 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-log-f${{ matrix.fedora }}
          path: install.log

# Build the bootc image on every push/PR, nightly, or on demand.
# - PRs: build + lint + bloat report only (no push)
# - main/nightly: also push to ghcr.io/<owner>/fw13-hypr
# - manual run with qcow2=true: also build a VM disk (for Proxmox testing) as an artifact
name: build-image
on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["image/**", ".github/workflows/build.yml"]
  schedule:
    - cron: "17 20 * * *"   # 03:17 Phnom Penh
  workflow_dispatch:
    inputs:
      qcow2:
        description: "Also build a qcow2 VM disk"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (runner ships ~30 GB of SDKs we don't need)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fw13-hypr:latest" >> "$GITHUB_ENV"

      - name: Build (fails on any missing package)
        run: |
          sudo podman build \
            --build-arg FEDORA_VERSION=44 \
            --build-arg HYPR_COPR=lionheartp/Hyprland \
            -t "$IMAGE" image/ 2>&1 | tee build.log

      - name: Bloat report
        if: always()
        run: |
          {
            echo '## fw13-hypr manifest'
            echo '```'
            sudo podman run --rm "$IMAGE" cat /usr/share/fw13-hypr-manifest.txt || echo "image not built"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push "$IMAGE"

      - name: Build qcow2 (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.qcow2
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v ./output:/output -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs btrfs --local "$IMAGE"
          sudo chown -R "$USER" output

      - name: Upload qcow2
        if: github.event_name == 'workflow_dispatch' && inputs.qcow2
        uses: actions/upload-artifact@v4
        with:
          name: fw13-hypr-qcow2
          path: output/qcow2/disk.qcow2
          retention-days: 3
